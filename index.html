<title>Beach Packing List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: decoy is a plain single-column checklist; the game is a single-column
   phone app with a sticky header, tab bar, and stacked face-down cards. */
:root {
  /* decoy (theme-aware, deliberately ordinary) */
  --d-bg: #f6f8f8; --d-fg: #1e2a2c; --d-muted: #66777a; --d-line: #dbe3e4; --d-card: #ffffff; --d-accent: #2a7f86;
  /* game (deliberately single dark look: night tide) */
  --ink: #0c1820; --sea: #132a36; --sea-2: #1b3846; --foam: #eaf2ef; --foam-dim: #a9bdb9;
  --coral: #ff7f61; --sand: #e9c995; --kelp: #67b8a3; --heat: #e0457b; --line: #24414f;
  --f-display: "Shrikhand", "Georgia", serif;
  --f-body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-plain: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --d-bg: #141b1c; --d-fg: #e3ebec; --d-muted: #93a4a6; --d-line: #2b3739; --d-card: #1c2526; --d-accent: #5fb4ba; color-scheme: dark } }
:root[data-theme="dark"] { --d-bg: #141b1c; --d-fg: #e3ebec; --d-muted: #93a4a6; --d-line: #2b3739; --d-card: #1c2526; --d-accent: #5fb4ba; color-scheme: dark }

html, body { min-height: 100%; }
[hidden] { display: none !important; }
body { background: var(--d-bg); color: var(--d-fg); font-family: var(--f-plain); }
body.in-game { background: var(--ink); color: var(--foam); }
button, input, select, textarea { font: inherit; }
:focus-visible { outline: 2px solid var(--d-accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- decoy ---------- */
#decoy { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 40px; }
.d-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.d-head h1 { font-size: 1.35rem; margin: 0; font-weight: 650; }
.d-icon { background: none; border: 0; font-size: 1.4rem; cursor: pointer; padding: 4px; line-height: 1; }
.d-sub { color: var(--d-muted); margin: 4px 0 16px; font-size: .9rem; }
.d-form { display: flex; gap: 8px; margin-bottom: 14px; }
.d-form input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--d-line); border-radius: 8px; background: var(--d-card); color: var(--d-fg); }
.d-form button { padding: 10px 14px; border-radius: 8px; border: 0; background: var(--d-accent); color: #fff; font-weight: 600; }
.d-list { list-style: none; margin: 0; padding: 0; background: var(--d-card); border: 1px solid var(--d-line); border-radius: 10px; }
.d-list li { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--d-line); }
.d-list li:first-child { border-top: 0; }
.d-list li.done span { text-decoration: line-through; color: var(--d-muted); }
.d-list li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.d-list .x { background: none; border: 0; color: var(--d-muted); font-size: 1.1rem; cursor: pointer; }
.d-count { color: var(--d-muted); font-size: .85rem; margin-top: 10px; }
.d-pin { display: grid; gap: 8px; margin-bottom: 14px; padding: 12px; border: 1px dashed var(--d-line); border-radius: 10px; }
.d-pin input { padding: 10px 12px; border: 1px solid var(--d-line); border-radius: 8px; background: var(--d-card); color: var(--d-fg); }
.d-pin .row { display: flex; gap: 8px; }
.d-pin button { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--d-line); background: var(--d-card); color: var(--d-fg); }
.d-pin .msg { color: var(--d-muted); font-size: .85rem; }

/* ---------- game ---------- */
#game { font-family: var(--f-body); max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 96px; }
#game :focus-visible { outline-color: var(--sand); }
.g-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); display: flex; align-items: center; gap: 10px; padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
.g-head h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.55rem; margin: 0; color: var(--coral); letter-spacing: .5px; flex: 1; }
.g-head .who { font-size: .8rem; color: var(--foam-dim); text-align: right; line-height: 1.2; }
.g-head .who b { color: var(--foam); display: block; font-size: .95rem; }
.lockbtn { background: var(--sea); border: 1px solid var(--line); color: var(--foam); border-radius: 999px; padding: 7px 12px; font-size: .85rem; cursor: pointer; }
.sync { font-size: .75rem; color: var(--foam-dim); margin-top: 8px; }
.sync.warn { color: var(--sand); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--ink); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { background: none; border: 0; color: var(--foam-dim); padding: 12px 2px 14px; font-size: .78rem; font-weight: 500; letter-spacing: .3px; cursor: pointer; }
.tabs button[aria-current="true"] { color: var(--coral); box-shadow: inset 0 2px 0 var(--coral); }

.dayline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 18px 0 4px; flex-wrap: wrap; }
.dayline h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; margin: 0; color: var(--foam); }
.dayline .date { color: var(--foam-dim); font-size: .9rem; }
.tide { display: flex; gap: 4px; margin: 8px 0 16px; }
.tide i { flex: 1; height: 6px; border-radius: 3px; background: var(--sea-2); }
.tide i.past { background: var(--kelp); opacity: .55; }
.tide i.now { background: var(--coral); }
.tide i.wc { box-shadow: 0 0 0 1px var(--sand); }
.note { color: var(--foam-dim); font-size: .9rem; line-height: 1.45; margin: 0 0 14px; }
.partnerline { font-size: .85rem; color: var(--foam-dim); margin: 0 0 14px; }
.partnerline b { color: var(--foam); font-weight: 600; }

.stack { display: grid; gap: 14px; }
.slot { background: var(--sea); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.slot-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.slot-name { font-size: .78rem; text-transform: uppercase; letter-spacing: 1.4px; color: var(--foam-dim); font-weight: 600; }
.chip { font-size: .72rem; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.flirty { color: var(--sand); }
.chip.teasing { color: var(--coral); }
.chip.naughty { color: var(--heat); }
.chip.done { color: var(--kelp); }
.chip.skipped { color: var(--foam-dim); }
.facedown { appearance: none; width: 100%; border: 1px dashed var(--line); border-radius: 10px; min-height: 108px; cursor: pointer; color: var(--foam-dim); font-size: .95rem;
  background: repeating-linear-gradient(-12deg, var(--sea-2) 0 10px, var(--sea) 10px 20px); }
.facedown span { background: var(--ink); padding: 6px 12px; border-radius: 999px; }
.cardtext { font-size: 1.12rem; line-height: 1.45; margin: 0; overflow-wrap: anywhere; }
.code { font-size: .82rem; color: var(--sand); }
.from { font-size: .8rem; color: var(--kelp); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border-radius: 10px; padding: 10px 14px; border: 1px solid var(--line); background: var(--sea-2); color: var(--foam); cursor: pointer; font-weight: 500; }
.btn.go { background: var(--coral); border-color: var(--coral); color: #1b0e0a; font-weight: 600; }
.btn.ghost { background: transparent; }
.btn.small { padding: 7px 10px; font-size: .85rem; }
.btn[disabled] { opacity: .45; cursor: default; }
textarea.g, input.g, select.g { width: 100%; box-sizing: border-box; background: var(--ink); color: var(--foam); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea.g { min-height: 84px; resize: vertical; }
.forfeit { border-top: 1px dashed var(--line); padding-top: 10px; display: grid; gap: 8px; }
.forfeit .lbl { font-size: .75rem; letter-spacing: 1.2px; text-transform: uppercase; color: var(--foam-dim); }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
.opt input { margin-top: 4px; }

.wild { border: 1px solid var(--sand); background: linear-gradient(160deg, var(--sea-2), var(--sea)); }
.wild .slot-name { color: var(--sand); }

.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; }
.score { background: var(--sea); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.score.lead { border-color: var(--coral); }
.score .n { font-family: var(--f-display); font-size: 2.6rem; color: var(--foam); line-height: 1; font-variant-numeric: tabular-nums; }
.score .p { font-size: .85rem; color: var(--foam-dim); margin-top: 6px; }
.score .tag { font-size: .72rem; letter-spacing: 1px; text-transform: uppercase; color: var(--coral); }
h3.sec { font-size: .8rem; letter-spacing: 1.4px; text-transform: uppercase; color: var(--foam-dim); margin: 22px 0 10px; font-weight: 600; }
.hist { display: grid; gap: 8px; }
.hrow { background: var(--sea); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; }
.hrow .meta { display: flex; justify-content: space-between; gap: 8px; font-size: .78rem; color: var(--foam-dim); flex-wrap: wrap; }
.hrow .t { font-size: .95rem; line-height: 1.4; overflow-wrap: anywhere; }
.reveal { background: none; border: 1px dashed var(--line); color: var(--sand); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; font-size: .9rem; }
.answer { color: var(--sand); font-size: .95rem; overflow-wrap: anywhere; }

.coupon { background: var(--sand); color: #2a1d0c; border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; border: 2px dashed #a8834b; }
.coupon.used { opacity: .45; text-decoration: line-through; }
.coupon b { font-weight: 600; }
.coupon .btn { background: #2a1d0c; color: var(--sand); border-color: #2a1d0c; }
.progress { height: 8px; border-radius: 4px; background: var(--sea-2); overflow: hidden; margin: 6px 0 2px; }
.progress i { display: block; height: 100%; background: var(--sand); }

.form { display: grid; gap: 12px; }
.form label { display: grid; gap: 6px; font-size: .88rem; color: var(--foam-dim); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { display: inline-flex; align-items: center; gap: 6px; background: var(--sea); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; color: var(--foam); cursor: pointer; font-size: .88rem; }
.seg input { accent-color: var(--coral); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex !important; grid-template-columns: none; align-items: center; gap: 10px; color: var(--foam) !important; }
.check input { accent-color: var(--coral); width: 18px; height: 18px; }
.danger { color: var(--heat); border-color: var(--heat); background: transparent; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--foam); color: var(--ink); padding: 9px 14px; border-radius: 999px; font-size: .9rem; z-index: 9; }
.hero { text-align: center; padding: 28px 0 8px; }
.hero h2 { font-family: var(--f-display); font-weight: 400; font-size: 2.2rem; color: var(--coral); margin: 0 0 6px; text-wrap: balance; }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.pick button { background: var(--sea); border: 1px solid var(--line); color: var(--foam); border-radius: 14px; padding: 22px 10px; cursor: pointer; display: grid; gap: 6px; }
.pick button b { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; }
.pick button.coral b { color: var(--coral); }
.pick button.riptide b { color: var(--kelp); }
.pick button[disabled] { opacity: .4; cursor: default; }
.nicks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.nick { background: var(--sea); border: 1px solid var(--line); color: var(--foam); border-radius: 12px; padding: 14px 10px; cursor: pointer; font-family: var(--f-display); font-size: 1.15rem; display: grid; gap: 2px; }
.nick small { font-family: var(--f-body); font-size: .72rem; color: var(--foam-dim); }
.nick.on { border-color: var(--coral); color: var(--coral); }
.nick[disabled] { opacity: .4; cursor: default; }
.empty { color: var(--foam-dim); font-size: .92rem; padding: 14px; border: 1px dashed var(--line); border-radius: 12px; line-height: 1.45; }
@media (max-width: 380px) { .grid2, .scores { grid-template-columns: 1fr; } }

/* ---------- phone fit ----------
   iOS Safari zooms the page when a focused field's text is under 16px and never zooms back,
   so every field is 16px. The rest tightens spacing so a day's cards fit with less scrolling. */
input, select, textarea { font-size: 16px !important; }
#decoy { padding-block: 12px 32px; }
.d-sub { margin: 2px 0 12px; }
.d-list li { padding: 9px 12px; }
#game { padding-block: 0 84px; }
.g-head { padding-block: 10px 8px; }
.g-head h1 { font-size: 1.3rem; }
.lockbtn { padding: 6px 11px; }
.dayline { margin: 12px 0 2px; }
.dayline h2 { font-size: 1.45rem; }
.tide { margin: 6px 0 10px; }
.note, .partnerline { margin-bottom: 10px; }
.stack { gap: 10px; }
.slot { padding: 12px; gap: 8px; border-radius: 12px; }
.facedown { min-height: 64px; }
.cardtext { font-size: 1rem; line-height: 1.42; }
.btn { padding: 9px 12px; }
.tabs button { padding: 10px 2px 11px; }
.scores { margin: 12px 0; gap: 10px; }
.score { padding: 12px; }
.score .n { font-size: 2.1rem; }
h3.sec { margin: 16px 0 8px; }
.hero { padding: 18px 0 4px; }
.hero h2 { font-size: 1.7rem; }
.pick button { padding: 16px 10px; }
.pick button b { font-size: 1.25rem; }
.nick { padding: 11px 8px; font-size: 1rem; }
.coupon { padding: 11px 12px; }
textarea.g { min-height: 64px; }
.slot .actions { flex-wrap: nowrap; }
.slot .actions .btn { flex: 1 1 auto; white-space: nowrap; }
</style>

function slotCard(st, play, s, d) {

  if (!x || !x.cardId) return `<section class="slot">${top(`<span class="chip ${s.tier}">${TIER_LABEL[s.tier]}</span>`)}<button type="button" class="facedown" data-act="flip" data-slot="${s.key}"><span>Tap to turn over</span></button></section>`;
  const c = cardById(x.cardId) || { tier: s.tier, text: "(missing card)" };
  const bonus = confirmBonus(st, play.player, d, s.key, x), confirmed = confirmedBy(st, play.player, d, s.key, x), partner = nameOf(other(play.player));
  const statusChip = x.status === "done" ? `<span class="chip done">Done +${slotPoints(st, x) + bonus}</span>` : x.status === "skipped" ? `<span class="chip skipped">Skipped ${slotPoints(st, x)}</span>` : `<span class="chip ${c.tier}">${TIER_LABEL[c.tier] || ""}</span>`;
  let inner = `<p class="cardtext">${esc(c.text)}</p>`;
  if (c.codeWord) inner += `<div class="code">Code word: ${esc(c.codeWord)}</div>`;
  if (c.custom) inner += `<div class="from">Written for you by ${(c.author ? nameOf(c.author) : "your partner")}</div>`;
  const id = `ans-d${d}-${s.key}`;

      <textarea class="g" id="${id}" placeholder="Details, or your own plan">${esc(x.answer || "")}</textarea>
      <div class="actions"><button type="button" class="btn go" data-act="wcdone" data-slot="${s.key}">Lock in my pick</button></div>`;

      <div class="actions"><button type="button" class="btn go" data-act="done" data-slot="${s.key}">Answered</button><button type="button" class="btn ghost" data-act="skip" data-slot="${s.key}">Skip ${ptsOf(st).skip}</button></div>`;

function viewScores(st) {

        }

}

/* ================= actions ================= */
async function savePlay(st, play) { await putDoc("plays", playId(st, play.player, play.day), play); }
function curPlay(st) { const d = dayNum(st), pl = me(); return JSON.parse(JSON.stringify(playOf(st, pl, d) || { player: pl, day: d, epoch: st.epoch, slots: {} })); }
function slotDef(st, key) { return slotsFor(st, dayNum(st)).find((s) => s.key === key); }

$("#game").addEventListener("click", async (e) => {
  if (e.target.closest("[data-tab],[data-act]") && typing(document.activeElement)) document.activeElement.blur(); // explicit action: let it render
  const tb = e.target.closest("[data-tab]");
  if (tb) { tab = tb.dataset.tab; LS.set("ptl_tab", tab); pendingConfirm = null; render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, st = S();
  if (act === "lock") return lock();
  if (readOnly && !["changepin", "reveal"].includes(act)) return toast("View only: ask your partner to invite you by email with Can edit access.");
  if (act === "claim") {
    const p = el.dataset.p;
    if (mode === "db") {
      const k = claimKey(), claims = { ...((S() || {}).claims || {}) };
      if (claims[p] && !ownsSeat(claims, p) && pendingConfirm !== "take:" + p) { pendingConfirm = "take:" + p; return render(); }
      pendingConfirm = null;
      const patch = { [p]: k };
      for (const q of ["coral", "riptide"]) if (q !== p && ownsSeat(claims, q)) patch[q] = null; // never delete keys: null merges cleanly
      await updateState({ claims: patch }, { claims: { ...claims, ...patch } });
    } else { LS.set("ptl_player", p); render(); }
    return;
  }
  if (act === "savesetup") return saveSetup();
  if (act === "changepin") { lock(); showPinSetup("Choose a new PIN (4–8 digits)."); return; }
  if (act === "release") {
    if (mode === "db") {
      const k = claimKey(), claims = { ...((S() || {}).claims || {}) };
      const patch = {};
      for (const q of ["coral", "riptide"]) if (ownsSeat(claims, q)) patch[q] = null;
      await updateState({ claims: patch }, { claims: { ...claims, ...patch } });
    } else { LS.del("ptl_player"); render(); }
    return;
  }
  if (act === "reset") { pendingConfirm = "reset"; return render(); }
  if (act === "resetno") { pendingConfirm = null; return render(); }
  if (act === "resetyes") { pendingConfirm = null; await updateState({ epoch: (S().epoch || 1) + 1 }); tab = "today"; toast("Game reset."); return; }
  if (act === "reveal") { revealed.add(el.dataset.k); return render(); }
  if (!st || !me()) return;
  if (act === "gonick") { tab = "nick"; render(); window.scrollTo(0, 0); return; }
  if (act === "nick" || act === "nickown") {
    const n = cleanName(act === "nick" ? el.dataset.n : ($("#nick-own") || {}).value);
    if (!n) { toast("Type a name using letters or numbers."); return; }
    if (n.toLowerCase() === chosenName(other(me())).toLowerCase()) { toast("Your partner already has that name."); return; }
    const was = tab === "nick";
    if (was) { tab = "settings"; LS.set("ptl_tab", tab); }
    await updateState({ names: { [me()]: n } }, { names: { ...((S() && S().names) || {}), [me()]: n } });
    toast(`You're ${n} now.`); return;
  }
  if (act === "confirm") {
    const p = el.dataset.p, day = +el.dataset.day, key = el.dataset.key;
    if (p === me() || !DARE_KEYS.has(key)) return;
    if (dayNum(st) > st.days) { toast("Scores are locked. The trip is over."); return; }
    const sl = ((playOf(st, p, day) || {}).slots || {})[key]; if (!sl || sl.status !== "done") return;
    const id = `e${st.epoch}_${me()}`, doc = JSON.parse(JSON.stringify(cache.confirms[id] || { player: me(), epoch: st.epoch, map: {} }));
    doc.map = doc.map || {}; doc.map[`${p}-${day}-${key}`] = sl.cardId;
    await putDoc("confirms", id, doc); toast(`Confirmed. +${confirmPts(st)} for ${nameOf(p)}`); return;
  }

  if (act === "flip") {
    const play = curPlay(st), s = slotDef(st, el.dataset.slot); if (!s || (play.slots[s.key] && play.slots[s.key].cardId)) return;
    let pick;
    if (s.pool === "wc") { const L = leaderFor(st, play.day); pick = { cardId: L === "tie" ? "wc:tie" : L === me() ? "wc:choice" : "wc:yes" }; }
    else pick = pickCard(st, me(), play.day, s);
    play.slots[s.key] = { cardId: pick.cardId, status: "open", at: Date.now() };
    await savePlay(st, play);
    if (pick.customId) { const c = cache.custom[pick.customId]; if (c) await putDoc("custom", pick.customId, { ...c, usedEpoch: st.epoch }); }
    return;
  }
  if (act === "done" || act === "wcdone") {
    const play = curPlay(st), k = el.dataset.slot, x = play.slots[k]; if (!x) return;
    const ta = $("#ans-d" + play.day + "-" + k); if (ta) x.answer = ta.value.trim();
    if (act === "wcdone") { const r = document.querySelector('input[name="wcopt"]:checked'); if (!r && !x.answer) { toast("Pick an option or type your plan."); return; } x.choice = r ? +r.value : null; }
    skipRestore.add("ans-d" + play.day + "-" + k);
    x.status = "done"; x.doneAt = Date.now(); await savePlay(st, play); toast(`+${slotPoints(st, x)} points`); return;
  }
  if (act === "skip") {
    const play = curPlay(st), x = play.slots[el.dataset.slot]; if (!x) return;
    x.status = "skipped"; x.forfeitId = x.forfeitId || pickFrom(st, "forfeit", me() + play.day + el.dataset.slot); x.forfeitDone = false;
    await savePlay(st, play); return;
  }
  if (act === "undo") {
    const play = curPlay(st), x = play.slots[el.dataset.slot]; if (!x) return;
    x.status = "open"; delete x.forfeitId; delete x.forfeitDone; await savePlay(st, play); return;
  }
  if (act === "swap") {
    const play = curPlay(st), s = slotDef(st, el.dataset.slot); if (!s) return;
    const x = play.slots[s.key]; if (!x || x.swapped) return;
    const pick = pickCard(st, me(), play.day, s, x.cardId);
    play.slots[s.key] = { cardId: pick.cardId, status: "open", swapped: true, prev: [x.cardId], at: Date.now() };
    await savePlay(st, play);
    if (pick.customId) { const c = cache.custom[pick.customId]; if (c) await putDoc("custom", pick.customId, { ...c, usedEpoch: st.epoch }); }
    toast("Swapped. One swap per night."); return;
  }
  if (act === "wild") { const play = curPlay(st); if (play.wild) return; play.wild = { cardId: pickFrom(st, "wild", me() + play.day), played: false }; await savePlay(st, play); return; }
  if (act === "playwild") { const play = curPlay(st); if (!play.wild || play.wild.played) return; play.wild.played = true; await savePlay(st, play); const w = ALL[play.wild.cardId], m = ptsOf(st).wild; toast(`${w.self >= 0 ? "+" : ""}${w.self * m} for you${w.partner ? `, ${w.partner >= 0 ? "+" : ""}${w.partner * m} for ${nameOf(other(me()))}` : ""}`); return; }
  if (act === "redeem" || act === "unredeem") {
    const id = `e${st.epoch}_${me()}`, w = JSON.parse(JSON.stringify(cache.wallet[id] || { player: me(), epoch: st.epoch, redeemed: {} }));
    w.redeemed = w.redeemed || {}; if (act === "redeem") w.redeemed[el.dataset.i] = true; else delete w.redeemed[el.dataset.i];
    await putDoc("wallet", id, w); if (act === "redeem") toast("Redeemed. Collect it."); return;
  }
  if (act === "addcard") {
    const text = ($("#w-text").value || "").trim(); if (!text) { toast("Write the card first."); return; }
    const kind = (document.querySelector('input[name="wkind"]:checked') || {}).value || "truth";
    let tier = (document.querySelector('input[name="wtier"]:checked') || {}).value || "teasing";
    if (kind === "day" && tier === "naughty") tier = "teasing";
    const id = "c" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
    $("#w-text").value = ""; skipRestore.add("w-text");
    await putDoc("custom", id, { author: me(), target: other(me()), kind, tier, text: text.slice(0, 600), created: Date.now() });
    toast(kind === "day" && tier === "teasing" && (document.querySelector('input[name="wtier"]:checked') || {}).value === "naughty" ? "Saved as Teasing. Daytime dares stay public-safe." : "Slipped into their deck.");
    return;
  }
  if (act === "delcard") { delDoc("custom", el.dataset.id); return; }
});
$("#game").addEventListener("focusout", (e) => { if (e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-act],[data-tab]")) return; setTimeout(() => { if (dirty && !typing(document.activeElement)) render(); }, 0); });
$("#game").addEventListener("change", async (e) => {
  const el = e.target;
  if (readOnly && el.dataset && el.dataset.act) { toast("View only: ask your partner to invite you by email with Can edit access."); render(); return; }
  if (el.dataset && el.dataset.act === "forfeitdone") { const st = S(), play = curPlay(st), x = play.slots[el.dataset.slot]; if (!x) return; x.forfeitDone = el.checked; await savePlay(st, play); }
});
async function saveSetup() {
  const prev = S() || defaultState();
  const v = (id) => $("#" + id), num = (id, d) => { const n = parseInt(v(id).value, 10); return Number.isFinite(n) ? n : d; };
  const days = Math.min(14, Math.max(2, num("s-days", 6)));
  const startDate = v("s-start").value || prev.startDate;
  let wc = num("s-wc", 0); if (wc > days) wc = days - 1;
  const ns = { ...prev, startDate, days, wcNight: wc, lightFinal: v("s-light").checked, partialFirst: v("s-partial").checked,
    slots: { truth: v("s-truth").checked, day: v("s-day").checked, night: v("s-night").checked, pillow: v("s-pillow").checked },
    points: Object.fromEntries(Object.keys(DEFAULT_POINTS).map((k) => [k, num("s-p-" + k, DEFAULT_POINTS[k])])) };
  if (!ns.claims) ns.claims = {}; if (!ns.epoch) ns.epoch = 1;
  const first = !S();
  if (first) await putDoc("game", "state", ns);
  else await updateState({ startDate, days, wcNight: wc, lightFinal: ns.lightFinal, partialFirst: ns.partialFirst, slots: ns.slots, points: ns.points });
  if (first) { tab = "today"; LS.set("ptl_tab", tab); } else toast("Setup saved.");
}

/* day rollover while unlocked */
let lastDay = null;
setInterval(() => { const st = S(); if (!unlocked || !st) return; const d = dayNum(st); if (d !== lastDay) { lastDay = d; render(); } }, 60000);

renderDecoy();
initStore();
})();
